ttributeName="opacity" values="0;0;1;1" keyTimes="0;0.41;0.44;1" dur="8s" repeatCount="indefinite"/></text><text x="140" y="402" font-family="'Fira Code', 'Consolas', 'Menlo', monospace" font-size="20" fill="#9CA3AF">6</text><text x="176" y="402" font-family="'Fira Code', 'Consolas', 'Menlo', monospace" font-size="20" fill="#F5F3FF" xml:space="preserve">    <tspan fill="#EC4899">return</tspan> jsonify(coffee=<tspan fill="#FCD34D">"☕"</tspan>,<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.50;0.53;1" dur="8s" repeatCount="indefinite"/></text><text x="140" y="438" font-family="'Fira Code', 'Consolas', 'Menlo', monospace" font-size="20" fill="#9CA3AF">7</text><text x="176" y="438" font-family="'Fira Code', 'Consolas', 'Menlo', monospace" font-size="20" fill="#F5F3FF" xml:space="preserve">                   music=<tspan fill="#FCD34D">"🎧"</tspan>, bugs=<tspan fill="#F87171">0</tspan>)<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.59;0.62;1" dur="8s" repeatCount="indefinite"/></text>
