    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140B2E"/><stop offset="0.55" stop-color="#0D0A1F"/><stop offset="1" stop-color="#1F0A22"/>
