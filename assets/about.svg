<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="580" viewBox="0 0 1600 580" role="img" aria-label="About me: building FastAPI and Next.js, exploring Go and UI/UX, open to collaborations">
  <title>About Me</title>
  <defs>
